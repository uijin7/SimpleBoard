<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleBoard</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            --primary: #2d6cdf;
            --primary-dark: #1f4fa8;
            --secondary: #6b7280;
            --danger: #d93025;
            --bg: #f4f7fb;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --border: #e5e7eb;
            --text: #1f2937;
            --muted: #6b7280;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(45, 108, 223, 0.12), transparent 20%),
                linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 28px 20px 34px;
            box-shadow: 0 10px 28px rgba(45, 108, 223, 0.2);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.88);
            font-size: 15px;
        }

        .container {
            max-width: 1200px;
            margin: -18px auto 32px;
            padding: 0 16px 32px;
        }

        .toolbar {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(229, 231, 235, 0.9);
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .toolbar a,
        .toolbar button {
            border: none;
            background: var(--primary);
            color: white;
            padding: 11px 15px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        .toolbar .secondary {
            background: var(--secondary);
        }

        .toolbar .danger {
            background: var(--danger);
        }

        .auth-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .auth-welcome {
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .status-title {
            font-size: 22px;
            font-weight: 700;
        }

        .status-subtitle {
            color: var(--muted);
            font-size: 14px;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 18px;
        }

        .board-card {
            background: var(--panel);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(229, 231, 235, 0.9);
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
        }

        .board-name {
            font-size: 22px;
            font-weight: 700;
        }

        .badge {
            background: #eaf2ff;
            color: var(--primary);
            padding: 6px 11px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-item {
            background: var(--panel-soft);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
        }

        .post-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .post-meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .post-content {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 12px;
            color: #374151;
        }

        .post-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .post-actions button {
            border: none;
            background: var(--primary);
            color: white;
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .post-actions .danger {
            background: var(--danger);
        }

        .empty-box,
        .loading-box {
            background: rgba(255, 255, 255, 0.72);
            border: 1px dashed rgba(107, 114, 128, 0.35);
            border-radius: 18px;
            color: var(--muted);
            padding: 26px 18px;
            text-align: center;
        }

        @media (max-width: 720px) {
            header {
                padding: 24px 16px 30px;
            }

            header h1 {
                font-size: 28px;
            }

            .container {
                padding: 0 12px 28px;
            }

            .toolbar {
                padding: 16px;
                border-radius: 16px;
            }

            .toolbar,
            .toolbar-group,
            .auth-area,
            .post-actions {
                width: 100%;
            }

            .toolbar a,
            .toolbar button,
            .post-actions button {
                width: 100%;
            }

            .board-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <h1>SimpleBoard</h1>
        <p>게시판별 글을 확인하고, 로그인 후 새 글을 작성하거나 수정할 수 있습니다.</p>
    </div>
</header>

<div class="container">
    <div class="toolbar">
        <div class="toolbar-group">
            <a href="/posts/write">게시글 작성</a>
            <button type="button" class="secondary" onclick="loadBoards()">새로고침</button>
            <a class="secondary" href="/swagger-ui.html">Swagger</a>
        </div>
        <div id="authArea" class="auth-area"></div>
    </div>

    <div class="status-bar">
        <div class="status-title">게시판 목록</div>
        <div class="status-subtitle">최신 게시글을 카드 형태로 확인할 수 있습니다.</div>
    </div>

    <div id="boardContainer" class="loading-box">불러오는 중...</div>
</div>

<script>
    let boards = [];

    async function loadAuthArea() {
        const authArea = document.getElementById("authArea");

        try {
            const response = await fetch("/api/auth/me");

            if (!response.ok) {
                authArea.innerHTML = `
                    <a href="/login">로그인</a>
                    <a href="/signup" class="secondary">회원가입</a>
                `;
                return;
            }

            const me = await response.json();
            authArea.innerHTML = `
                <span class="auth-welcome">${escapeHtml(me.name ?? "")}님</span>
                ${(me.role ?? "").toUpperCase() === "ADMIN" ? `<a href="/admin/members" class="secondary">회원관리</a>` : ""}
                <button type="button" class="secondary" onclick="logout()">로그아웃</button>
            `;
        } catch (error) {
            console.error(error);
            authArea.innerHTML = `
                <a href="/login">로그인</a>
                <a href="/signup" class="secondary">회원가입</a>
            `;
        }
    }

    async function logout() {
        await fetch("/api/auth/logout", { method: "POST" });
        location.reload();
    }

    async function loadBoards() {
        const boardContainer = document.getElementById("boardContainer");
        boardContainer.className = "loading-box";
        boardContainer.textContent = "불러오는 중...";

        try {
            const response = await fetch("/api/board/ids");
            if (!response.ok) {
                throw new Error("게시판 목록 조회 실패: " + response.status);
            }

            boards = await response.json();
            renderBoards();
        } catch (error) {
            console.error(error);
            boardContainer.className = "empty-box";
            boardContainer.textContent = "데이터를 불러오지 못했습니다.";
        }
    }

    function renderBoards() {
        const boardContainer = document.getElementById("boardContainer");

        if (!Array.isArray(boards) || boards.length === 0) {
            boardContainer.className = "empty-box";
            boardContainer.textContent = "게시판 데이터가 없습니다.";
            return;
        }

        boardContainer.className = "";
        boardContainer.innerHTML = `
            <div class="board-grid">
                ${boards.map(board => {
                    const boardName = board.board_name ?? board.boardName ?? "이름 없음";
                    const status = board.status ?? "";
                    const posts = board.post_list ?? board.postList ?? [];

                    return `
                        <div class="board-card">
                            <div class="board-header">
                                <div class="board-name">${escapeHtml(boardName)}</div>
                                ${status ? `<span class="badge">${escapeHtml(status)}</span>` : ""}
                            </div>

                            ${
                                posts.length === 0
                                    ? `<div class="empty-box">등록된 게시글이 없습니다.</div>`
                                    : `
                                        <div class="post-list">
                                            ${posts.map(post => {
                                                const normalizedPost = {
                                                    id: post.id,
                                                    boardId: post.board_id ?? post.boardId ?? board.id,
                                                    userName: post.user_name ?? post.userName ?? "",
                                                    email: post.email ?? "",
                                                    title: post.title ?? "",
                                                    content: post.content ?? ""
                                                };

                                                const json = encodeURIComponent(JSON.stringify(normalizedPost));
                                                const title = post.title ?? "제목 없음";
                                                const userName = post.user_name ?? post.userName ?? "작성자 없음";
                                                const content = post.content ?? "";
                                                const postedAt = post.posted_at ?? post.postedAt ?? "";

                                                return `
                                                    <div class="post-item">
                                                        <div class="post-title">${escapeHtml(title)}</div>
                                                        <div class="post-meta">
                                                            작성자 ${escapeHtml(userName)}
                                                            ${postedAt ? ` | 작성일 ${escapeHtml(formatDate(postedAt))}` : ""}
                                                        </div>
                                                        <div class="post-content">${escapeHtml(content)}</div>
                                                        <div class="post-actions">
                                                            <button type="button" onclick="goEdit('${json}')">수정</button>
                                                            <button type="button" class="danger" onclick="deletePost(${post.id})">삭제</button>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join("")}
                                        </div>
                                    `
                            }
                        </div>
                    `;
                }).join("")}
            </div>
        `;
    }

    function goEdit(encodedPost) {
        const post = JSON.parse(decodeURIComponent(encodedPost));
        sessionStorage.setItem("editPost", JSON.stringify(post));
        location.href = `/posts/edit/${post.id}`;
    }

    async function deletePost(postId) {
        const password = prompt("삭제할 게시글의 비밀번호 4자리 이상을 입력하세요.");
        if (password === null) return;

        if (password.trim().length < 4) {
            alert("비밀번호는 4자리 이상이어야 합니다.");
            return;
        }

        try {
            const response = await fetch("/api/post/delete", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    post_id: postId,
                    password: password.trim()
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "삭제 실패");
            }

            alert("게시글이 삭제되었습니다.");
            loadBoards();
        } catch (error) {
            console.error(error);
            alert(error.message || "오류가 발생했습니다.");
        }
    }

    function formatDate(value) {
        try {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString("ko-KR");
        } catch (error) {
            return value;
        }
    }

    async function extractErrorMessage(response, fallback) {
        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
            const data = await response.json();
            return data.message || fallback;
        }

        const text = await response.text();
        return text || fallback;
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    window.addEventListener("DOMContentLoaded", async () => {
        await loadAuthArea();
        await loadBoards();
    });
</script>
</body>
</html>
