<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            --primary: #2d6cdf;
            --primary-dark: #1f4fa8;
            --bg: #f4f7fb;
            --panel: #ffffff;
            --border: #d8dce5;
            --text: #222;
            --muted: #667085;
            --success: #0b8a38;
            --error: #d93025;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(45, 108, 223, 0.14), transparent 24%),
                linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 28px 20px;
            box-shadow: 0 8px 24px rgba(45, 108, 223, 0.18);
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.88);
            font-size: 14px;
        }

        .container {
            max-width: 960px;
            margin: 32px auto;
            padding: 0 16px 32px;
        }

        .panel {
            background: var(--panel);
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            padding: 28px;
            border: 1px solid rgba(216, 220, 229, 0.7);
        }

        .panel-title {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .panel-description {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 14px;
            font-weight: 700;
        }

        .hint {
            color: var(--muted);
            font-size: 12px;
            margin-top: -2px;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(45, 108, 223, 0.12);
        }

        .field input[readonly] {
            background: #f8fafc;
            color: #475467;
        }

        .field textarea {
            min-height: 220px;
            resize: vertical;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        button,
        a.btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        button:hover,
        a.btn:hover {
            filter: brightness(0.98);
        }

        a.btn.secondary {
            background: #6b7280;
        }

        .message {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 700;
        }

        .message.success { color: var(--success); }
        .message.error { color: var(--error); }

        @media (max-width: 720px) {
            .panel {
                padding: 22px 18px;
                border-radius: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            button,
            a.btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>게시글 작성</h1>
    <p>게시판을 선택하고 제목과 내용을 입력해 새 글을 등록하세요.</p>
</header>

<div class="container">
    <div class="panel">
        <h2 class="panel-title">새 글 입력</h2>
        <p class="panel-description">로그인한 회원 정보는 자동으로 채워지며, 비밀번호 4자리 이상을 입력해야 등록할 수 있습니다.</p>

        <form id="postForm">
            <div class="form-grid">
                <div class="field">
                    <label for="boardId">게시판</label>
                    <select id="boardId" required></select>
                </div>

                <div class="field">
                    <label for="password">비밀번호</label>
                    <input id="password" type="password" minlength="4" maxlength="20" required>
                    <div class="hint">수정 또는 삭제 시 사용할 4자리 이상 비밀번호입니다.</div>
                </div>

                <div class="field">
                    <label for="userName">작성자</label>
                    <input id="userName" type="text" required readonly>
                </div>

                <div class="field">
                    <label for="email">이메일</label>
                    <input id="email" type="email" required readonly>
                </div>

                <div class="field full">
                    <label for="title">제목</label>
                    <input id="title" type="text" placeholder="제목을 입력하세요" required>
                </div>

                <div class="field full">
                    <label for="content">내용</label>
                    <textarea id="content" placeholder="내용을 입력하세요" required></textarea>
                </div>
            </div>

            <div class="actions">
                <button type="submit">등록하기</button>
                <a href="/" class="btn secondary">목록으로</a>
            </div>

            <div id="message" class="message"></div>
        </form>
    </div>
</div>

<script>
    let loginMember = null;

    async function loadLoginMember() {
        const response = await fetch("/api/auth/me");

        if (!response.ok) {
            location.href = "/login";
            return;
        }

        loginMember = await response.json();

        document.getElementById("userName").value = loginMember.name ?? "";
        document.getElementById("email").value = loginMember.email ?? "";
    }

    async function loadBoardOptions() {
        try {
            const response = await fetch("/api/board/ids");
            if (!response.ok) {
                throw new Error("게시판 목록 조회 실패");
            }

            const boards = await response.json();
            const select = document.getElementById("boardId");

            if (!Array.isArray(boards) || boards.length === 0) {
                select.innerHTML = '<option value="">게시판이 없습니다</option>';
                return;
            }

            select.innerHTML = boards.map(board => {
                const id = board.id;
                const name = board.board_name ?? board.boardName ?? "이름 없음";
                return `<option value="${id}">${escapeHtml(name)}</option>`;
            }).join("");
        } catch (error) {
            console.error(error);
            showMessage("게시판 목록을 불러오지 못했습니다.", "error");
        }
    }

    async function submitPost(event) {
        event.preventDefault();

        const payload = {
            board_id: Number(document.getElementById("boardId").value),
            user_name: document.getElementById("userName").value.trim(),
            password: document.getElementById("password").value.trim(),
            email: document.getElementById("email").value.trim(),
            title: document.getElementById("title").value.trim(),
            content: document.getElementById("content").value.trim()
        };

        if (payload.password.length < 4) {
            showMessage("비밀번호는 4자리 이상이어야 합니다.", "error");
            return;
        }

        try {
            const response = await fetch("/api/post", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "게시글 등록 실패");
            }

            showMessage("게시글이 등록되었습니다.", "success");

            setTimeout(() => {
                location.href = "/";
            }, 500);
        } catch (error) {
            console.error(error);
            showMessage(error.message || "오류가 발생했습니다.", "error");
        }
    }

    function showMessage(text, type) {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = `message ${type}`;
    }

    async function extractErrorMessage(response, fallback) {
        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
            const data = await response.json();
            return data.message || fallback;
        }

        const text = await response.text();
        return text || fallback;
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    document.getElementById("postForm").addEventListener("submit", submitPost);

    window.addEventListener("DOMContentLoaded", async () => {
        await loadLoginMember();
        await loadBoardOptions();
    });
</script>
</body>
</html>
